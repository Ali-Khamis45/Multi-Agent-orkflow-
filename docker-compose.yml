services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aiagentsteam
      POSTGRES_USER: aiagentsteam
      POSTGRES_PASSWORD: aiagentsteam
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagentsteam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=aiagentsteam;Username=aiagentsteam;Password=aiagentsteam"
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5080:8080"

  # ai-runtime and frontend services are added once their Dockerfiles land
  # (Phase 1 milestones 2 and 5) — kept out until then so `docker compose up`
  # always succeeds at every intermediate commit.

volumes:
  postgres-data:
