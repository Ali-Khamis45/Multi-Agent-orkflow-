services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aiagentsteam
      POSTGRES_USER: aiagentsteam
      POSTGRES_PASSWORD: aiagentsteam
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagentsteam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=aiagentsteam;Username=aiagentsteam;Password=aiagentsteam"
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      AiRuntime__BaseUrl: "http://ai-runtime:8000"
      # Local-dev-only signing secret — see docs/DEPLOYMENT.md before deploying anywhere else.
      Jwt__Secret: "local-dev-only-secret-change-me-before-any-real-deployment-32chars"
      # Shared with ai-runtime's INTERNAL_SERVICE_KEY below — service-to-service auth.
      Internal__ServiceKey: "local-dev-only-secret-change-me-before-any-real-deployment-32chars"
    ports:
      - "5080:8080"

  ai-runtime:
    build:
      context: ./ai-runtime
      dockerfile: Dockerfile
    depends_on:
      - api
      - redis
    environment:
      ENVIRONMENT: Docker
      API_BASE_URL: "http://api:8080"
      REDIS_URL: "redis://redis:6379"
      SELF_BASE_URL: "http://ai-runtime:8000"
      WORKSPACE_FILES_ROOT: "/data/workspace-files"
      # Shared with the API's Internal__ServiceKey above.
      INTERNAL_SERVICE_KEY: "local-dev-only-secret-change-me-before-any-real-deployment-32chars"
      # ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / OLLAMA_HOST:
      # leave unset to run fully on the Multi-Model Router's mock fallback
      # (ARCHITECTURE_EXTENSION.md §E7) — set any of them to use a real model.
    ports:
      - "8000:8000"
    volumes:
      - workspace-files:/data/workspace-files

  # frontend is added once its Dockerfile lands (Phase 1 milestone 5) — kept
  # out until then so `docker compose up` always succeeds at every
  # intermediate commit.

volumes:
  postgres-data:
  workspace-files:
