[project]
name = "ai-runtime"
version = "0.1.0"
description = "AI Runtime: reasoning, planning, tool execution, and autonomous decision making for the AI Agents Team platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
